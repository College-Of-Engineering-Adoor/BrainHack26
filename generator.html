<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure QR Generator | Brain Hack'26</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&display=swap');
        
        body { background: #050505; color: #E2E8F0; font-family: 'Montserrat', sans-serif; padding: 40px; text-align: center; }
        h1 { color: #7692FF; text-transform: uppercase; margin-bottom: 20px; }
        
        .btn {
            background: #7692FF; color: #050505; border: none; padding: 12px 25px; border-radius: 8px;
            cursor: pointer; font-size: 1rem; font-weight: 900; text-transform: uppercase; display: inline-block;
            margin: 5px; text-decoration: none; transition: 0.3s;
        }

        input[type="file"] { display: none; }

        #qr-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
            max-width: 1000px; margin: 40px auto 0 auto;
        }

        .qr-card {
            background: #ffffff; padding: 20px; border-radius: 8px; text-align: center; color: #000;
        }

        .qr-image { display: flex; justify-content: center; margin-bottom: 10px; }
        .qr-id { font-weight: 900; font-size: 0.8rem; letter-spacing: 1px; word-break: break-all; color: #7692FF; margin-top: 5px;}
        .qr-team { font-weight: 900; font-size: 1.2rem; text-transform: uppercase; }

        @media print {
            body { background: white; padding: 0; }
            h1, .btn, #controls { display: none; }
            #qr-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .qr-card { border: 1px solid #ccc; page-break-inside: avoid; width: 200px; }
        }
    </style>
</head>
<body>

    <h1>Payment-Linked QR Generator</h1>
    
    <div id="controls">
        <label for="csv-upload" class="btn">1. Load CSV & Extract QRs</label>
        <input type="file" id="csv-upload" accept=".csv">
    </div>

    <div id="print-ui" style="display: none; margin-top: 20px;">
        <button class="btn" style="background: #00e676;" onclick="window.print()">2. Print / Save to PDF</button>
    </div>

    <div id="qr-grid"></div>

    <script>
        function extractDriveId(url) {
            if (!url) return null;
            const match = url.match(/id=([^&]+)/) || url.match(/d\/([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        document.getElementById('csv-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const text = event.target.result;
                const rows = text.split('\n').map(row => {
                    const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                    return row.split(regex).map(cell => cell.replace(/^"|"$/g, '').trim());
                });
                
                const headers = rows[0];
                const paymentIndex = headers.indexOf("Payment Proof");
                const teamNameIndex = headers.indexOf("Team Name");
                
                if (paymentIndex === -1) {
                    alert("Error: Could not find a column named 'Payment Proof'. Please ensure this exactly matches your Google Sheet header.");
                    return;
                }
                
                const grid = document.getElementById('qr-grid');
                grid.innerHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].length > 1 && rows[i][paymentIndex]) {
                        
                        let firstUrl = rows[i][paymentIndex].split(',')[0];
                        let driveId = extractDriveId(firstUrl);
                        let teamName = teamNameIndex !== -1 ? rows[i][teamNameIndex] : `Team ${i}`;

                        if (driveId) {
                            let card = document.createElement('div');
                            card.className = 'qr-card';
                            card.innerHTML = `<div class="qr-team">${teamName}</div><div class="qr-image" id="qr-${driveId}"></div><div class="qr-id">${driveId}</div>`;
                            grid.appendChild(card);

                            new QRCode(document.getElementById(`qr-${driveId}`), {
                                text: driveId,
                                width: 150, height: 150, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                            });
                        }
                    }
                }
                document.getElementById('print-ui').style.display = 'block';
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
