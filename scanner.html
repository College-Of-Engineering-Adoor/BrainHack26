<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk Scanner | Brain Hack'26</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-dark: #050505; --card-bg: #0d1322; --border: #1c253c; 
            --text: #E2E8F0; --blue: #7692FF; --green: #00e676; --red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text); padding: 20px; }

        .container {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 600px;
            margin: 0 auto; text-align: center;
        }

        h2 { color: var(--blue); margin-bottom: 20px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }

        .btn {
            background: var(--border); color: var(--text); border: 1px solid var(--blue);
            padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; text-decoration: none;
            font-size: 1rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; transition: 0.3s;
            display: block; box-sizing: border-box;
        }

        .btn:hover { background: var(--blue); color: var(--bg-dark); }
        .btn-success { background: rgba(0, 230, 118, 0.1); border-color: var(--green); color: var(--green); }
        .btn-success:hover { background: var(--green); color: var(--bg-dark); }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; border: 2px solid var(--border); }
        input[type="file"] { display: none; }

        /* --- VERIFIED DOSSIER UI --- */
        .dossier { display: none; text-align: left; margin-top: 20px; }
        
        .verified-banner {
            background: rgba(0, 230, 118, 0.15); border: 2px solid var(--green);
            color: var(--green); padding: 20px; border-radius: 8px; text-align: center;
            font-weight: 900; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase;
        }

        .verified-banner.denied {
            background: rgba(255, 77, 77, 0.15); border-color: var(--red); color: var(--red);
        }

        .details-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .detail-item {
            background: #060913; border: 1px solid var(--border);
            padding: 15px; border-radius: 8px;
        }

        .detail-label { font-size: 0.75rem; color: #a0aec0; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; letter-spacing: 1px; }
        .detail-value { font-size: 1.1rem; font-weight: 600; color: var(--text); word-break: break-word; }

        /* Iframe Styles for Drive Files */
        .drive-iframe {
            width: 100%; height: 300px; border-radius: 8px;
            margin-top: 10px; border: 1px solid var(--border); background: #000;
        }
    </style>
</head>
<body>

    <div class="container" id="setup-screen">
        <h2>System Initialization</h2>
        <p style="color: #a0aec0; margin-bottom: 20px; font-size: 0.9rem;">Load the master CSV file to begin.</p>
        
        <label for="csv-upload" class="btn">1. Load Master CSV</label>
        <input type="file" id="csv-upload" accept=".csv">
        
        <div id="db-status" style="color: var(--green); margin-top: 10px; display: none; font-weight: bold;">Database Loaded Successfully</div>
        
        <button class="btn btn-success" id="start-btn" style="margin-top: 20px; display: none;" onclick="startScanner()">2. Initialize Scanner</button>
    </div>

    <div class="container" id="scanner-screen" style="display: none;">
        <h2 id="scanner-title">Awaiting Scan</h2>
        <p style="color: #a0aec0; margin-bottom: 20px; font-weight: bold;" id="scan-count">Teams Checked In: 0</p>

        <div id="reader"></div>

        <div class="dossier" id="dossier-view">
            <div id="status-banner" class="verified-banner">VERIFIED</div>
            
            <div class="details-grid" id="details-container">
                <!-- Data injected here dynamically -->
            </div>

            <button class="btn btn-success" style="margin-top: 25px;" id="confirm-btn" onclick="markCheckedIn()">Confirm & Admit</button>
            <button class="btn" style="margin-top: 10px; background: transparent; border-color: var(--border); color: #a0aec0;" onclick="resumeScanner()">Cancel / Scan Another</button>
        </div>

        <button class="btn" style="margin-top: 30px; border-color: var(--blue); color: var(--blue); background: transparent;" onclick="downloadUpdatedCSV()">Export Final CSV</button>
    </div>

    <script>
        let database = [];
        let headers = [];
        let checkedInCount = 0;
        let html5QrcodeScanner;
        let currentScannedTeam = null;

        // Strict whitelist for UI display
        const allowedFields = [
            "college", 
            "department", 
            "email:", 
            "phone number:", 
            "payment proof", 
            "id proof (1)", 
            "number of members:"
        ];

        document.getElementById('csv-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const text = event.target.result;
                const rows = text.split('\n').map(row => {
                    const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                    return row.split(regex).map(cell => cell.replace(/^"|"$/g, '').trim());
                });
                
                headers = rows[0];
                if (!headers.includes("Check-In Status")) headers.push("Check-In Status");
                
                if (!headers.includes("Payment Proof")) {
                    alert("Critical Error: The uploaded CSV does not have a column named 'Payment Proof'.");
                    return;
                }

                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].length > 1) {
                        let obj = {};
                        for (let j = 0; j < headers.length; j++) {
                            obj[headers[j]] = rows[i][j] || "";
                        }
                        database.push(obj);
                    }
                }
                
                document.getElementById('db-status').style.display = 'block';
                document.getElementById('start-btn').style.display = 'block';
            };
            reader.readAsText(file);
        });

        function startScanner() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('scanner-screen').style.display = 'block';
            document.getElementById('reader').style.display = 'block';

            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        // Extracts Drive ID to build an iframe preview link
        function getDriveIframeUrl(url) {
            const match = url.match(/id=([^&]+)/) || url.match(/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/file/d/${match[1]}/preview` : null;
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.pause();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('scanner-title').innerText = "Processing...";
            
            currentScannedTeam = database.find(row => {
                const proofUrl = row["Payment Proof"] || "";
                return proofUrl.includes(decodedText);
            });

            const dossier = document.getElementById('dossier-view');
            const banner = document.getElementById('status-banner');
            const detailsContainer = document.getElementById('details-container');
            const confirmBtn = document.getElementById('confirm-btn');
            
            detailsContainer.innerHTML = '';
            dossier.style.display = 'block';

            if (!currentScannedTeam) {
                banner.className = 'verified-banner denied';
                banner.innerHTML = `INVALID QR<br><span style="font-size: 1rem;">Payment ID Not Found</span>`;
                confirmBtn.style.display = 'none';
            } else if (currentScannedTeam["Check-In Status"] === "TRUE" || currentScannedTeam["Check-In Status"] === "Checked In") {
                banner.className = 'verified-banner denied';
                banner.innerHTML = `ALREADY ADMITTED<br><span style="font-size: 1rem;">Payment ID already verified.</span>`;
                confirmBtn.style.display = 'none';
                buildDossierUI();
            } else {
                banner.className = 'verified-banner';
                banner.innerHTML = `VERIFIED<br><span style="font-size: 1rem;">PAYMENT AUTHENTICATED</span>`;
                confirmBtn.style.display = 'block';
                buildDossierUI();
            }
        }

        function buildDossierUI() {
            const container = document.getElementById('details-container');
            
            for (let key in currentScannedTeam) {
                // Check against strict whitelist
                if (!allowedFields.includes(key.toLowerCase().trim())) continue; 
                
                let val = currentScannedTeam[key];
                if (!val) continue; 

                let itemHTML = `<div class="detail-item"><div class="detail-label">${key}</div>`;
                
                if (val.includes("drive.google.com")) {
                    let urls = val.split(','); 
                    urls.forEach(u => {
                        let iframeUrl = getDriveIframeUrl(u.trim());
                        if (iframeUrl) {
                            itemHTML += `<iframe src="${iframeUrl}" class="drive-iframe" allow="autoplay"></iframe>`;
                        } else {
                            itemHTML += `<div class="detail-value"><a href="${u}" target="_blank" style="color: var(--blue);">View File</a></div>`;
                        }
                    });
                } else {
                    itemHTML += `<div class="detail-value">${val}</div>`;
                }
                
                itemHTML += `</div>`;
                container.innerHTML += itemHTML;
            }
        }

        function markCheckedIn() {
            if (currentScannedTeam) {
                currentScannedTeam["Check-In Status"] = "Checked In";
                checkedInCount++;
                document.getElementById('scan-count').innerText = `Teams Checked In: ${checkedInCount}`;
                resumeScanner();
            }
        }

        function resumeScanner() {
            document.getElementById('dossier-view').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('scanner-title').innerText = "Awaiting Scan";
            html5QrcodeScanner.resume();
        }

        function downloadUpdatedCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            
            csvContent += headers.map(h => `"${h}"`).join(",") + "\r\n";
            
            database.forEach(rowObject => {
                let row = headers.map(header => {
                    let cellData = rowObject[header] || "";
                    return `"${cellData.toString().replace(/"/g, '""')}"`;
                });
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "BrainHack26_Final_Entry_Log.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
